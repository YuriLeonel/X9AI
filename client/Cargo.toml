[package]
name = "x9ai-client"
version = "0.1.0"
edition = "2021"
description = "X9AI system-tray utility: brain-dump capture, /process send, clipboard paste"

[lib]
name = "x9ai_client"
path = "src/lib.rs"

[[bin]]
name = "x9ai-client"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
global-hotkey = "0.6"
cpal = "0.15"
arboard = "3.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

[profile.release]
strip = true